<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>404 · Gahlaker Arcade</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f2eee3;color:#121211;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding:24px}
  main{text-align:center;max-width:460px}
  .mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 24px;border-radius:15px;background:#121211;color:#d9ff43;font:900 28px/1 Arial,sans-serif;transform:rotate(-4deg)}
  .code{font:600 15px/1 "SFMono-Regular",monospace;letter-spacing:.2em;color:#6b665a}
  h1{margin:14px 0 10px;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:-.06em;line-height:1}
  p{margin:0 auto 28px;color:#6b665a;font-size:14px;line-height:1.7}
  a{display:inline-flex;align-items:center;gap:8px;background:#121211;color:#fffaf0;text-decoration:none;font-size:13px;font-weight:600;padding:13px 20px;border-radius:999px}
  a span{color:#d9ff43}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">G</div>
  <div class="code">404 / LOST IN THE ARCADE</div>
  <h1>这局不存在。</h1>
  <p>你要找的页面可能已经被移走，或者地址敲错了。回大厅再挑一个吧。</p>
