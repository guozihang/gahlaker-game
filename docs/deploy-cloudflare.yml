name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '_headers'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Build static site
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Ensure Pages project exists
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: npx wrangler pages project create gzhlaker-arcade --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.skip == 'false'
        run: npx wrangler pages deploy dist --project-name=gzhlaker-arcade --branch=main

      - name: Attach custom domain (best effort)
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/gzhlaker-arcade/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"game.gzhlaker.cc.cd"}'

      - name: Summary
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://gzhlaker-arcade.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://game.gzhlaker.cc.cd" >> "$GITHUB_STEP_SUMMARY"
